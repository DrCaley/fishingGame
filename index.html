<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lake Spearfishing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
            text-shadow: 2px 2px 4px black;
            z-index: 100;
        }
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            text-shadow: 2px 2px 4px black;
            z-index: 100;
            background: rgba(0,0,0,0.5);
            padding: 40px;
            border-radius: 20px;
        }
        #instructions h1 { font-size: 48px; margin-bottom: 20px; }
        #instructions p { font-size: 20px; margin: 10px 0; }
    </style>
</head>
<body>
    <div id="ui">Score: <span id="score">0</span></div>
    <div id="instructions">
        <h1>🎣 Lake Spearfishing</h1>
        <p>Arrow Keys / WASD - Move around</p>
        <p>Mouse - Look around</p>
        <p>Click - Throw spear at fish</p>
        <p><br><strong>Click anywhere to start!</strong></p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script>
        // Game state
        let scene, camera, renderer;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let fish = [];
        let bears = [];
        let spears = [];
        let spearTraces = [];
        let realisticFishTemplate = null;
        let lakeFishByChunk = new Map();
        let worldChunks = new Map();
        let activeChunkX = null;
        let activeChunkZ = null;
        let score = 0;
        let gameStarted = false;
        let yaw = 0, pitch = 0;

        const TILE_SIZE = 340;
        const LAKE_RADIUS = 80;
        const CHUNK_LOAD_RADIUS = 1;
        const FISH_PER_LAKE = 8;

        // Initialize
        init();
        animate();

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 90, 620);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 80);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 1);
            sunLight.position.set(50, 100, 50);
            sunLight.castShadow = true;
            scene.add(sunLight);

            // Streamed mountain-lake world
            updateWorldChunks(true);

            // Create fish
            loadRealisticFishModel();

            // Controls
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('click', onClick);
            document.addEventListener('mousemove', onMouseMove);
            window.addEventListener('resize', onResize);
        }

        function loadRealisticFishModel() {
            const loader = new THREE.GLTFLoader();
            const modelUrl = 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/BarramundiFish/glTF-Binary/BarramundiFish.glb';

            loader.load(
                modelUrl,
                (gltf) => {
                    realisticFishTemplate = gltf.scene;
                    createFish();
                },
                undefined,
                () => {
                    realisticFishTemplate = null;
                    createFish();
                }
            );
        }

        function getChunkKey(chunkX, chunkZ) {
            return `${chunkX},${chunkZ}`;
        }

        function getLakeCenterForPosition(x, z) {
            return {
                x: Math.round(x / TILE_SIZE) * TILE_SIZE,
                z: Math.round(z / TILE_SIZE) * TILE_SIZE
            };
        }

        function seededRandom(seed) {
            const value = Math.sin(seed * 127.1) * 43758.5453123;
            return value - Math.floor(value);
        }

        function createChunk(chunkX, chunkZ) {
            const key = getChunkKey(chunkX, chunkZ);
            if (worldChunks.has(key)) return;

            const centerX = chunkX * TILE_SIZE;
            const centerZ = chunkZ * TILE_SIZE;
            const chunkGroup = new THREE.Group();

            const groundGeometry = new THREE.PlaneGeometry(TILE_SIZE, TILE_SIZE, 1, 1);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x3d9140 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.set(centerX, -0.11, centerZ);
            ground.receiveShadow = true;
            chunkGroup.add(ground);

            const waterGeometry = new THREE.CircleGeometry(LAKE_RADIUS, 64);
            const waterMaterial = new THREE.MeshPhongMaterial({
                color: 0xcff6ff,
                transparent: true,
                opacity: 0.03,
                shininess: 8,
                depthWrite: false,
                side: THREE.DoubleSide
            });
            const water = new THREE.Mesh(waterGeometry, waterMaterial);
            water.rotation.x = -Math.PI / 2;
            water.position.set(centerX, 0, centerZ);
            chunkGroup.add(water);

            const bedGeometry = new THREE.CircleGeometry(LAKE_RADIUS, 64);
            const bedMaterial = new THREE.MeshLambertMaterial({ color: 0x8B7355 });
            const bed = new THREE.Mesh(bedGeometry, bedMaterial);
            bed.rotation.x = -Math.PI / 2;
            bed.position.set(centerX, -8, centerZ);
            chunkGroup.add(bed);

            createTreesForChunk(chunkGroup, chunkX, chunkZ, centerX, centerZ);
            createMountainsForChunk(chunkGroup, chunkX, chunkZ, centerX, centerZ);
            createBearForChunk(chunkGroup, chunkX, chunkZ, centerX, centerZ, key);

            scene.add(chunkGroup);
            worldChunks.set(key, chunkGroup);

            if (!lakeFishByChunk.has(key)) {
                spawnFishInLake(centerX, centerZ, key, FISH_PER_LAKE);
            }
        }

        function createTreesForChunk(chunkGroup, chunkX, chunkZ, centerX, centerZ) {
            const treeCount = 42;
            for (let i = 0; i < treeCount; i++) {
                const seed = chunkX * 991 + chunkZ * 577 + i * 37;
                const angle = seededRandom(seed) * Math.PI * 2;
                const radius = LAKE_RADIUS + 20 + seededRandom(seed + 1) * 85;

                const x = centerX + Math.cos(angle) * radius;
                const z = centerZ + Math.sin(angle) * radius;

                const trunkHeight = 4 + seededRandom(seed + 2) * 3;
                const trunkGeometry = new THREE.CylinderGeometry(0.45, 0.7, trunkHeight, 8);
                const trunkMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
                const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
                trunk.position.set(x, trunkHeight * 0.5, z);
                trunk.castShadow = true;
                chunkGroup.add(trunk);

                const leavesGeometry = new THREE.ConeGeometry(2.6 + seededRandom(seed + 3) * 1.6, 6.5 + seededRandom(seed + 4) * 2.5, 8);
                const leavesMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 });
                const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
                leaves.position.set(x, trunkHeight + 3.3, z);
                leaves.castShadow = true;
                chunkGroup.add(leaves);
            }
        }

        function createMountainsForChunk(chunkGroup, chunkX, chunkZ, centerX, centerZ) {
            const mountainCount = 20;
            for (let i = 0; i < mountainCount; i++) {
                const seed = chunkX * 1301 + chunkZ * 719 + i * 53;
                const angle = (i / mountainCount) * Math.PI * 2 + (seededRandom(seed) - 0.5) * 0.24;
                const radius = LAKE_RADIUS + 75 + seededRandom(seed + 1) * 52;
                const height = 28 + seededRandom(seed + 2) * 62;
                const baseRadius = 12 + seededRandom(seed + 3) * 22;

                const mountainGeometry = new THREE.ConeGeometry(baseRadius, height, 8);
                const mountainMaterial = new THREE.MeshLambertMaterial({ color: 0x5e6b72 });
                const mountain = new THREE.Mesh(mountainGeometry, mountainMaterial);
                mountain.position.set(
                    centerX + Math.cos(angle) * radius,
                    height * 0.5 - 0.2,
                    centerZ + Math.sin(angle) * radius
                );
                mountain.rotation.y = seededRandom(seed + 4) * Math.PI;
                mountain.castShadow = true;
                mountain.receiveShadow = true;
                chunkGroup.add(mountain);

                const snowGeometry = new THREE.ConeGeometry(baseRadius * 0.35, height * 0.28, 8);
                const snowMaterial = new THREE.MeshLambertMaterial({ color: 0xf2f6fb });
                const snowCap = new THREE.Mesh(snowGeometry, snowMaterial);
                snowCap.position.set(0, height * 0.36, 0);
                mountain.add(snowCap);
            }
        }

        function createBearForChunk(chunkGroup, chunkX, chunkZ, centerX, centerZ, chunkKey) {
            const seed = chunkX * 1733 + chunkZ * 883;
            const startAngle = seededRandom(seed) * Math.PI * 2;
            const patrolRadius = LAKE_RADIUS + 18 + seededRandom(seed + 1) * 10;

            const bear = new THREE.Group();

            const body = new THREE.Mesh(
                new THREE.BoxGeometry(3.2, 1.8, 1.8),
                new THREE.MeshLambertMaterial({ color: 0x5b3a1e })
            );
            body.position.set(0, 1.5, 0);
            body.castShadow = true;
            bear.add(body);

            const head = new THREE.Mesh(
                new THREE.BoxGeometry(1.2, 1.1, 1.1),
                new THREE.MeshLambertMaterial({ color: 0x654321 })
            );
            head.position.set(1.9, 2.0, 0);
            head.castShadow = true;
            bear.add(head);

            const snout = new THREE.Mesh(
                new THREE.BoxGeometry(0.55, 0.45, 0.55),
                new THREE.MeshLambertMaterial({ color: 0x8b6b4a })
            );
            snout.position.set(2.45, 1.85, 0);
            snout.castShadow = true;
            bear.add(snout);

            const earGeometry = new THREE.SphereGeometry(0.22, 8, 8);
            const earMaterial = new THREE.MeshLambertMaterial({ color: 0x5b3a1e });
            const leftEar = new THREE.Mesh(earGeometry, earMaterial);
            leftEar.position.set(1.6, 2.55, -0.38);
            leftEar.castShadow = true;
            bear.add(leftEar);
            const rightEar = new THREE.Mesh(earGeometry, earMaterial);
            rightEar.position.set(1.6, 2.55, 0.38);
            rightEar.castShadow = true;
            bear.add(rightEar);

            const legGeometry = new THREE.CylinderGeometry(0.22, 0.24, 1.1, 8);
            const legMaterial = new THREE.MeshLambertMaterial({ color: 0x3f2a18 });
            const legPositions = [
                [1.0, 0.65, -0.55],
                [1.0, 0.65, 0.55],
                [-1.0, 0.65, -0.55],
                [-1.0, 0.65, 0.55]
            ];
            legPositions.forEach((pos) => {
                const leg = new THREE.Mesh(legGeometry, legMaterial);
                leg.position.set(pos[0], pos[1], pos[2]);
                leg.castShadow = true;
                bear.add(leg);
            });

            bear.userData = {
                isBear: true,
                chunkKey,
                lakeCenterX: centerX,
                lakeCenterZ: centerZ,
                patrolRadius,
                angle: startAngle,
                speed: 0.0025 + seededRandom(seed + 2) * 0.0015,
                bobPhase: seededRandom(seed + 3) * Math.PI * 2
            };

            bear.position.set(
                centerX + Math.cos(startAngle) * patrolRadius,
                0,
                centerZ + Math.sin(startAngle) * patrolRadius
            );
            bear.rotation.y = -startAngle + Math.PI * 0.5;

            chunkGroup.add(bear);
            bears.push(bear);
        }

        function updateBears(elapsedMs) {
            bears.forEach((bear) => {
                bear.userData.angle += bear.userData.speed;

                const x = bear.userData.lakeCenterX + Math.cos(bear.userData.angle) * bear.userData.patrolRadius;
                const z = bear.userData.lakeCenterZ + Math.sin(bear.userData.angle) * bear.userData.patrolRadius;
                bear.position.x = x;
                bear.position.z = z;
                bear.position.y = Math.sin(elapsedMs * 0.004 + bear.userData.bobPhase) * 0.06;
                bear.rotation.y = -bear.userData.angle + Math.PI * 0.5;
            });
        }

        function updateWorldChunks(force = false) {
            const chunkX = Math.round(camera.position.x / TILE_SIZE);
            const chunkZ = Math.round(camera.position.z / TILE_SIZE);

            if (!force && chunkX === activeChunkX && chunkZ === activeChunkZ) {
                return;
            }

            activeChunkX = chunkX;
            activeChunkZ = chunkZ;

            const neededKeys = new Set();

            for (let dx = -CHUNK_LOAD_RADIUS; dx <= CHUNK_LOAD_RADIUS; dx++) {
                for (let dz = -CHUNK_LOAD_RADIUS; dz <= CHUNK_LOAD_RADIUS; dz++) {
                    const cx = chunkX + dx;
                    const cz = chunkZ + dz;
                    const key = getChunkKey(cx, cz);
                    neededKeys.add(key);
                    createChunk(cx, cz);
                }
            }

            for (const [key, chunkGroup] of worldChunks.entries()) {
                if (!neededKeys.has(key)) {
                    bears = bears.filter((bear) => {
                        if (bear.userData.chunkKey === key) {
                            return false;
                        }
                        return true;
                    });

                    const lakeFish = lakeFishByChunk.get(key);
                    if (lakeFish) {
                        lakeFish.forEach((fishMesh) => scene.remove(fishMesh));
                        fish = fish.filter((fishMesh) => !lakeFish.includes(fishMesh));
                        lakeFishByChunk.delete(key);
                    }
                    scene.remove(chunkGroup);
                    worldChunks.delete(key);
                }
            }
        }

        function spawnFishInLake(lakeCenterX, lakeCenterZ, chunkKey, count) {
            if (lakeFishByChunk.has(chunkKey)) return;

            const lakeFish = [];
            for (let i = 0; i < count; i++) {
                lakeFish.push(createSingleFish(lakeCenterX, lakeCenterZ, chunkKey));
            }
            lakeFishByChunk.set(chunkKey, lakeFish);
        }

        function createFish() {
            for (const key of worldChunks.keys()) {
                if (lakeFishByChunk.has(key)) continue;

                const [chunkX, chunkZ] = key.split(',').map(Number);
                const lakeCenterX = chunkX * TILE_SIZE;
                const lakeCenterZ = chunkZ * TILE_SIZE;
                spawnFishInLake(lakeCenterX, lakeCenterZ, key, FISH_PER_LAKE);
            }
        }

        function createTrees() {}
        function createMountains() {}

        function onKeyDown(event) {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = true; break;
                case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                case 'ArrowRight': case 'KeyD': moveRight = true; break;
            }
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = false; break;
                case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                case 'ArrowRight': case 'KeyD': moveRight = false; break;
            }
        }

        function onMouseMove(event) {
            if (!gameStarted) return;
            
            yaw -= event.movementX * 0.002;
            pitch -= event.movementY * 0.002;
            pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
            
            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        }

        function onClick(event) {
            if (!gameStarted) {
                gameStarted = true;
                document.getElementById('instructions').style.display = 'none';
                document.body.requestPointerLock();
            }

            createSpearProjectile();

            // Throw spear (raycasting)
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            
            const intersects = raycaster.intersectObjects(fish, true);
            if (intersects.length > 0) {
                let hitFish = intersects[0].object;
                while (hitFish && !hitFish.userData.isFishRoot) {
                    hitFish = hitFish.parent;
                }
                if (!hitFish) {
                    return;
                }

                const lakeCenterX = hitFish.userData.lakeCenterX;
                const lakeCenterZ = hitFish.userData.lakeCenterZ;
                const chunkKey = hitFish.userData.chunkKey;

                score += hitFish.userData.points;
                document.getElementById('score').textContent = score;
                
                // Remove fish
                scene.remove(hitFish);
                fish = fish.filter(f => f !== hitFish);
                if (chunkKey && lakeFishByChunk.has(chunkKey)) {
                    const lakeFish = lakeFishByChunk.get(chunkKey).filter(f => f !== hitFish);
                    lakeFishByChunk.set(chunkKey, lakeFish);
                }
                
                // Respawn after delay
                setTimeout(() => {
                    if (!chunkKey || worldChunks.has(chunkKey)) {
                        const respawnedFish = createSingleFish(lakeCenterX, lakeCenterZ, chunkKey);
                        if (chunkKey) {
                            const lakeFish = lakeFishByChunk.get(chunkKey) || [];
                            lakeFish.push(respawnedFish);
                            lakeFishByChunk.set(chunkKey, lakeFish);
                        }
                    }
                }, 3000);
            }
        }

        function createSpearProjectile() {
            const spearGroup = new THREE.Group();

            const shaftGeometry = new THREE.CylinderGeometry(0.12, 0.14, 4.5, 10);
            const shaftMaterial = new THREE.MeshPhongMaterial({ color: 0xd28a45, emissive: 0x331100 });
            const shaft = new THREE.Mesh(shaftGeometry, shaftMaterial);
            shaft.rotation.z = Math.PI / 2;
            spearGroup.add(shaft);

            const tipGeometry = new THREE.ConeGeometry(0.28, 0.9, 12);
            const tipMaterial = new THREE.MeshPhongMaterial({ color: 0xffffff, emissive: 0x6699ff });
            const tip = new THREE.Mesh(tipGeometry, tipMaterial);
            tip.rotation.z = -Math.PI / 2;
            tip.position.x = 2.5;
            spearGroup.add(tip);

            const start = camera.position.clone();
            const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).normalize();

            spearGroup.position.copy(start).add(direction.clone().multiplyScalar(1.5));
            spearGroup.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), direction.clone());
            spearGroup.userData = {
                velocity: direction.multiplyScalar(1.5),
                life: 0
            };

            const traceMaterial = new THREE.LineBasicMaterial({ color: 0xffff66, transparent: true, opacity: 0.95 });
            const tracePoints = [
                start.clone().add(direction.clone().multiplyScalar(1.2)),
                start.clone().add(direction.clone().multiplyScalar(45))
            ];
            const traceGeometry = new THREE.BufferGeometry().setFromPoints(tracePoints);
            const traceLine = new THREE.Line(traceGeometry, traceMaterial);
            traceLine.userData = { life: 0 };
            scene.add(traceLine);
            spearTraces.push(traceLine);

            scene.add(spearGroup);
            spears.push(spearGroup);
        }

        function updateSpears() {
            for (let i = spears.length - 1; i >= 0; i--) {
                const spear = spears[i];
                spear.position.add(spear.userData.velocity);
                spear.userData.life += 1;

                if (spear.userData.velocity.lengthSq() > 0) {
                    const spearDir = spear.userData.velocity.clone().normalize();
                    spear.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), spearDir);
                }

                if (spear.userData.life > 70) {
                    scene.remove(spear);
                    spears.splice(i, 1);
                }
            }

            for (let i = spearTraces.length - 1; i >= 0; i--) {
                const trace = spearTraces[i];
                trace.userData.life += 1;
                trace.material.opacity = Math.max(0, 0.95 - trace.userData.life * 0.08);

                if (trace.userData.life > 12) {
                    scene.remove(trace);
                    spearTraces.splice(i, 1);
                }
            }
        }

        function createSingleFish(lakeCenterX = null, lakeCenterZ = null, chunkKey = null) {
            const fishColors = [0x4169E1, 0x228B22, 0xFF6347, 0x8B4513, 0xFFD700];
            const fishNames = ['Bluegill', 'Bass', 'Trout', 'Catfish', 'Golden Carp'];
            const fishPoints = [10, 25, 30, 40, 100];

            if (lakeCenterX === null || lakeCenterZ === null) {
                const lakeCenter = getLakeCenterForPosition(camera.position.x, camera.position.z);
                lakeCenterX = lakeCenter.x;
                lakeCenterZ = lakeCenter.z;
            }

            if (!chunkKey) {
                const chunkX = Math.round(lakeCenterX / TILE_SIZE);
                const chunkZ = Math.round(lakeCenterZ / TILE_SIZE);
                chunkKey = getChunkKey(chunkX, chunkZ);
            }

            const colorIndex = Math.random() < 0.1 ? 4 : Math.floor(Math.random() * 4);
            let fishMesh;

            if (realisticFishTemplate) {
                fishMesh = realisticFishTemplate.clone(true);
                const bounds = new THREE.Box3().setFromObject(fishMesh);
                const size = new THREE.Vector3();
                bounds.getSize(size);
                const maxSide = Math.max(size.x, size.y, size.z) || 1;
                const targetSize = 6;
                const scale = targetSize / maxSide;
                fishMesh.scale.setScalar(scale);

                fishMesh.traverse((node) => {
                    if (node.isMesh) {
                        node.castShadow = true;
                    }
                });
            } else {
                const bodyGeometry = new THREE.ConeGeometry(1.5, 6, 10);
                bodyGeometry.rotateZ(Math.PI / 2);
                const bodyMaterial = new THREE.MeshPhongMaterial({
                    color: fishColors[colorIndex],
                    shininess: 140,
                    emissive: fishColors[colorIndex],
                    emissiveIntensity: 0.35
                });
                fishMesh = new THREE.Mesh(bodyGeometry, bodyMaterial);
                const tailGeometry = new THREE.ConeGeometry(1.2, 2, 6);
                tailGeometry.rotateZ(-Math.PI / 2);
                const tail = new THREE.Mesh(tailGeometry, bodyMaterial);
                tail.position.x = -3.8;
                fishMesh.add(tail);
            }

            const angle = Math.random() * Math.PI * 2;
            const radius = 10 + Math.random() * 60;
            fishMesh.position.set(
                lakeCenterX + Math.cos(angle) * radius,
                -0.4 - Math.random() * 1.6,
                lakeCenterZ + Math.sin(angle) * radius
            );

            fishMesh.userData = {
                isFishRoot: true,
                name: fishNames[colorIndex],
                points: fishPoints[colorIndex],
                speed: 0.04 + Math.random() * 0.06,
                angle: Math.random() * Math.PI * 2,
                turnSpeed: 0.01 + Math.random() * 0.025,
                minDepth: -0.4 - Math.random() * 1.2,
                maxDepth: -1.8 - Math.random() * 2.4,
                depthPhase: Math.random() * Math.PI * 2,
                nextTurnAt: performance.now() + 300 + Math.random() * 1400,
                lakeCenterX,
                lakeCenterZ,
                chunkKey
            };

            fish.push(fishMesh);
            scene.add(fishMesh);

            return fishMesh;
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (gameStarted) {
                // Player movement
                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                const speed = 0.3;
                if (moveForward || moveBackward) {
                    velocity.z = direction.z * speed;
                }
                if (moveLeft || moveRight) {
                    velocity.x = direction.x * speed;
                }

                // Move in camera direction
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                forward.y = 0;
                forward.normalize();
                
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                right.y = 0;
                right.normalize();

                camera.position.addScaledVector(forward, -velocity.z);
                camera.position.addScaledVector(right, velocity.x);
                
                // Keep camera at eye level
                camera.position.y = 5;

                updateWorldChunks();

                velocity.x *= 0.9;
                velocity.z *= 0.9;

                // Animate fish
                fish.forEach(f => {
                    const now = performance.now();

                    if (now > f.userData.nextTurnAt) {
                        const turnAmount = (Math.random() - 0.5) * 1.2;
                        f.userData.angle += turnAmount;
                        f.userData.speed = 0.03 + Math.random() * 0.08;
                        f.userData.nextTurnAt = now + 300 + Math.random() * 1600;
                    }

                    f.userData.angle += (Math.random() - 0.5) * f.userData.turnSpeed;
                    f.position.x += Math.cos(f.userData.angle) * f.userData.speed;
                    f.position.z += Math.sin(f.userData.angle) * f.userData.speed;
                    f.rotation.y = -f.userData.angle + Math.PI / 2;

                    const depthRange = f.userData.minDepth - f.userData.maxDepth;
                    f.position.y = f.userData.minDepth - ((Math.sin(now * 0.0016 + f.userData.depthPhase) + 1) * 0.5 * depthRange);

                    // Keep fish in their local lake with random bounce
                    const localX = f.position.x - f.userData.lakeCenterX;
                    const localZ = f.position.z - f.userData.lakeCenterZ;
                    const dist = Math.sqrt(localX ** 2 + localZ ** 2);
                    if (dist > LAKE_RADIUS - 10) {
                        const toCenter = Math.atan2(f.userData.lakeCenterZ - f.position.z, f.userData.lakeCenterX - f.position.x);
                        f.userData.angle = toCenter + (Math.random() - 0.5) * 0.5;
                        f.position.x = f.userData.lakeCenterX + localX * 0.96;
                        f.position.z = f.userData.lakeCenterZ + localZ * 0.96;
                    }
                });

                updateBears(performance.now());

                updateSpears();
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
