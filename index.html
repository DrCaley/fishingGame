<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lake Spearfishing</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
            text-shadow: 2px 2px 4px black;
            z-index: 100;
        }
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            text-shadow: 2px 2px 4px black;
            z-index: 100;
            background: rgba(0,0,0,0.5);
            padding: 40px;
            border-radius: 20px;
        }
        #instructions h1 { font-size: 48px; margin-bottom: 20px; }
        #instructions p { font-size: 20px; margin: 10px 0; }
    </style>
</head>
<body>
    <div id="ui">Score: <span id="score">0</span></div>
    <div id="instructions">
        <h1>🎣 Lake Spearfishing</h1>
        <p>Arrow Keys / WASD - Move around</p>
        <p>Mouse - Look around</p>
        <p>Click - Throw spear at fish</p>
        <p><br><strong>Click anywhere to start!</strong></p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game state
        let scene, camera, renderer;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let fish = [];
        let spears = [];
        let score = 0;
        let gameStarted = false;
        let yaw = 0, pitch = 0;

        // Initialize
        init();
        animate();

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 50, 200);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 80);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 1);
            sunLight.position.set(50, 100, 50);
            sunLight.castShadow = true;
            scene.add(sunLight);

            // Ground (shore)
            const groundGeometry = new THREE.CircleGeometry(150, 64);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x3d9140 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.1;
            ground.receiveShadow = true;
            scene.add(ground);

            // Lake water (transparent)
            const waterGeometry = new THREE.CircleGeometry(80, 64);
            const waterMaterial = new THREE.MeshPhongMaterial({ 
                color: 0x006994,
                transparent: true,
                opacity: 0.3,
                shininess: 100
            });
            const water = new THREE.Mesh(waterGeometry, waterMaterial);
            water.rotation.x = -Math.PI / 2;
            water.position.y = 0;
            scene.add(water);

            // Lake bed
            const bedGeometry = new THREE.CircleGeometry(80, 64);
            const bedMaterial = new THREE.MeshLambertMaterial({ color: 0x8B7355 });
            const bed = new THREE.Mesh(bedGeometry, bedMaterial);
            bed.rotation.x = -Math.PI / 2;
            bed.position.y = -8;
            scene.add(bed);

            // Create fish
            createFish();

            // Create trees
            createTrees();

            // Controls
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('click', onClick);
            document.addEventListener('mousemove', onMouseMove);
            window.addEventListener('resize', onResize);
        }

        function createFish() {
            const fishColors = [0x4169E1, 0x228B22, 0xFF6347, 0x8B4513, 0xFFD700];
            const fishNames = ['Bluegill', 'Bass', 'Trout', 'Catfish', 'Golden Carp'];
            const fishPoints = [10, 25, 30, 40, 100];

            for (let i = 0; i < 20; i++) {
                // Fish body
                const bodyGeometry = new THREE.ConeGeometry(0.8, 3, 8);
                bodyGeometry.rotateZ(Math.PI / 2);
                
                const colorIndex = Math.random() < 0.1 ? 4 : Math.floor(Math.random() * 4);
                const bodyMaterial = new THREE.MeshPhongMaterial({ 
                    color: fishColors[colorIndex],
                    shininess: 100
                });
                
                const fishMesh = new THREE.Mesh(bodyGeometry, bodyMaterial);
                
                // Tail
                const tailGeometry = new THREE.ConeGeometry(0.6, 1, 4);
                tailGeometry.rotateZ(-Math.PI / 2);
                const tail = new THREE.Mesh(tailGeometry, bodyMaterial);
                tail.position.x = -2;
                fishMesh.add(tail);

                // Position fish in the lake
                const angle = Math.random() * Math.PI * 2;
                const radius = 10 + Math.random() * 60;
                fishMesh.position.set(
                    Math.cos(angle) * radius,
                    -0.5 - Math.random() * 1.5,
                    Math.sin(angle) * radius
                );

                // Fish data
                fishMesh.userData = {
                    name: fishNames[colorIndex],
                    points: fishPoints[colorIndex],
                    speed: 0.02 + Math.random() * 0.03,
                    angle: Math.random() * Math.PI * 2,
                    turnSpeed: 0.01 + Math.random() * 0.02
                };

                fish.push(fishMesh);
                scene.add(fishMesh);
            }
        }

        function createTrees() {
            for (let i = 0; i < 80; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 90 + Math.random() * 50;
                
                // Trunk
                const trunkGeometry = new THREE.CylinderGeometry(0.5, 0.7, 5, 8);
                const trunkMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
                const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
                trunk.position.set(
                    Math.cos(angle) * radius,
                    2.5,
                    Math.sin(angle) * radius
                );
                trunk.castShadow = true;
                scene.add(trunk);

                // Leaves
                const leavesGeometry = new THREE.ConeGeometry(3, 8, 8);
                const leavesMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 });
                const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
                leaves.position.set(
                    Math.cos(angle) * radius,
                    9,
                    Math.sin(angle) * radius
                );
                leaves.castShadow = true;
                scene.add(leaves);
            }
        }

        function onKeyDown(event) {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = true; break;
                case 'ArrowDown': case 'KeyS': moveBackward = true; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
                case 'ArrowRight': case 'KeyD': moveRight = true; break;
            }
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveForward = false; break;
                case 'ArrowDown': case 'KeyS': moveBackward = false; break;
                case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
                case 'ArrowRight': case 'KeyD': moveRight = false; break;
            }
        }

        function onMouseMove(event) {
            if (!gameStarted) return;
            
            yaw -= event.movementX * 0.002;
            pitch -= event.movementY * 0.002;
            pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
            
            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        }

        function onClick(event) {
            if (!gameStarted) {
                gameStarted = true;
                document.getElementById('instructions').style.display = 'none';
                document.body.requestPointerLock();
                return;
            }

            createSpearProjectile();

            // Throw spear (raycasting)
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            
            const intersects = raycaster.intersectObjects(fish);
            if (intersects.length > 0) {
                const hitFish = intersects[0].object;
                score += hitFish.userData.points;
                document.getElementById('score').textContent = score;
                
                // Remove fish
                scene.remove(hitFish);
                fish = fish.filter(f => f !== hitFish);
                
                // Respawn after delay
                setTimeout(() => {
                    createSingleFish();
                }, 3000);
            }
        }

        function createSpearProjectile() {
            const spearGroup = new THREE.Group();

            const shaftGeometry = new THREE.CylinderGeometry(0.05, 0.06, 3.2, 8);
            const shaftMaterial = new THREE.MeshPhongMaterial({ color: 0x8b5a2b });
            const shaft = new THREE.Mesh(shaftGeometry, shaftMaterial);
            shaft.rotation.z = Math.PI / 2;
            spearGroup.add(shaft);

            const tipGeometry = new THREE.ConeGeometry(0.12, 0.5, 10);
            const tipMaterial = new THREE.MeshPhongMaterial({ color: 0xd9d9d9, emissive: 0x333333 });
            const tip = new THREE.Mesh(tipGeometry, tipMaterial);
            tip.rotation.z = -Math.PI / 2;
            tip.position.x = 1.8;
            spearGroup.add(tip);

            const start = camera.position.clone();
            const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).normalize();

            spearGroup.position.copy(start).add(direction.clone().multiplyScalar(1.5));
            spearGroup.lookAt(spearGroup.position.clone().add(direction));
            spearGroup.userData = {
                velocity: direction.multiplyScalar(2.2),
                life: 0
            };

            scene.add(spearGroup);
            spears.push(spearGroup);
        }

        function updateSpears() {
            for (let i = spears.length - 1; i >= 0; i--) {
                const spear = spears[i];
                spear.position.add(spear.userData.velocity);
                spear.userData.life += 1;

                if (spear.userData.life > 45) {
                    scene.remove(spear);
                    spears.splice(i, 1);
                }
            }
        }

        function createSingleFish() {
            const fishColors = [0x4169E1, 0x228B22, 0xFF6347, 0x8B4513, 0xFFD700];
            const fishNames = ['Bluegill', 'Bass', 'Trout', 'Catfish', 'Golden Carp'];
            const fishPoints = [10, 25, 30, 40, 100];

            const bodyGeometry = new THREE.ConeGeometry(0.8, 3, 8);
            bodyGeometry.rotateZ(Math.PI / 2);
            
            const colorIndex = Math.random() < 0.1 ? 4 : Math.floor(Math.random() * 4);
            const bodyMaterial = new THREE.MeshPhongMaterial({ 
                color: fishColors[colorIndex],
                shininess: 100
            });
            
            const fishMesh = new THREE.Mesh(bodyGeometry, bodyMaterial);
            
            const tailGeometry = new THREE.ConeGeometry(0.6, 1, 4);
            tailGeometry.rotateZ(-Math.PI / 2);
            const tail = new THREE.Mesh(tailGeometry, bodyMaterial);
            tail.position.x = -2;
            fishMesh.add(tail);

            const angle = Math.random() * Math.PI * 2;
            const radius = 10 + Math.random() * 60;
            fishMesh.position.set(
                Math.cos(angle) * radius,
                -0.5 - Math.random() * 1.5,
                Math.sin(angle) * radius
            );

            fishMesh.userData = {
                name: fishNames[colorIndex],
                points: fishPoints[colorIndex],
                speed: 0.02 + Math.random() * 0.03,
                angle: Math.random() * Math.PI * 2,
                turnSpeed: 0.01 + Math.random() * 0.02
            };

            fish.push(fishMesh);
            scene.add(fishMesh);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (gameStarted) {
                // Player movement
                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                const speed = 0.3;
                if (moveForward || moveBackward) {
                    velocity.z = direction.z * speed;
                }
                if (moveLeft || moveRight) {
                    velocity.x = direction.x * speed;
                }

                // Move in camera direction
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                forward.y = 0;
                forward.normalize();
                
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                right.y = 0;
                right.normalize();

                camera.position.addScaledVector(forward, -velocity.z);
                camera.position.addScaledVector(right, velocity.x);
                
                // Keep camera at eye level
                camera.position.y = 5;

                velocity.x *= 0.9;
                velocity.z *= 0.9;

                // Animate fish
                fish.forEach(f => {
                    f.userData.angle += f.userData.turnSpeed;
                    f.position.x += Math.cos(f.userData.angle) * f.userData.speed;
                    f.position.z += Math.sin(f.userData.angle) * f.userData.speed;
                    f.rotation.y = -f.userData.angle + Math.PI / 2;

                    // Keep fish in lake
                    const dist = Math.sqrt(f.position.x ** 2 + f.position.z ** 2);
                    if (dist > 70) {
                        f.userData.angle += Math.PI;
                    }
                });

                updateSpears();
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
